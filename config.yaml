instruments:
  scope1:
    name: RTA
    address: TCPIP::192.168.100.100::INSTR
    timeout: 20000
  scope2:
    name: RTO
    address: TCPIP::192.168.0.5::INSTR
    timeout: 20000
  scope3:
    name: KEY
    address: TCPIP::169.254.168.151::INSTR
    timeout: 20000
  smu:
    name: SMU
    address: TCPIP::169.254.216.252::INSTR
    timeout: null
  arbGen:
    name: Arbitrary Generator
    address: TCPIP::192.168.0.34::INSTR
    timeout: 20000
  powerSupply:
    name: Power Supply
    address: TCPIP::192.168.0.35::INSTR
    timeout: 20000
paths:
  output_base: Output
  iv_curves: IV Curves
  spectrum: Spectrum
  waveform: Waveform
constants:
  histogram_bins: 50
  histogram_update_interval: 100
  peak_prominence: 80
  iv_default_start: 1.0
  iv_default_stop: -40.0
  iv_default_step: 0.05
  current_min_threshold: -1e-7
  vbr_voltage_threshold: -0.01
  qr_voltage_threshold: 0.75
  plot_width: 6
  plot_height: 4
  plot_dpi: 100
gui:
  window_width: 1200
  window_height: 700
  default_appearance: System
  default_scaling: 100
audio:
  enable_beep: true
  beep_frequency_start: 650
  beep_duration: 500
  beep_count: 3
logging:
  enable: true
  level: ERROR
  file: error.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
threading:
  enable_threading: true
  thread_timeout: 300
file_formats:
  data_extension: .txt
  plot_extension: .png
  archive_extension: .zip
  encoding: utf-8
